version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: matsak-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-matsak_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dev_admin_password}
      MONGO_INITDB_DATABASE: matsak
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-matsak_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-dev_user_password}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_dev_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - matsak-dev-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: matsak-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - matsak-dev-network

  redis:
    image: redis:7-alpine
    container_name: matsak-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - matsak-dev-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: matsak-elasticsearch-dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    networks:
      - matsak-dev-network
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: matsak-api-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: "8080"
      MONGO_URI: "mongodb://${MONGO_APP_USERNAME:-matsak_user}:${MONGO_APP_PASSWORD:-dev_user_password}@mongodb:27017/matsak?authSource=matsak"
      DB_URI: "mongodb://${MONGO_APP_USERNAME:-matsak_user}:${MONGO_APP_PASSWORD:-dev_user_password}@mongodb:27017/matsak?authSource=matsak"
      JWT_SECRET: "${JWT_SECRET:-development-jwt-secret}"
      CORS_ORIGIN: '["http://localhost:3000","http://localhost:3001","http://localhost:8080"]'
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_SECURE: "false"
      MAIL_FROM: "Matsak <noreply@matsak.com>"
      APP_NAME: "Matsak"
      APP_API_URL: "${APP_API_URL:-http://localhost:8080}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      SUPPORT_EMAIL: "support@matsak-mg.com"
      CONTACT_EMAIL: "contact@matsak-mg.com"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379"
      ELASTICSEARCH_NODE: "http://elasticsearch:9200"
      ELASTICSEARCH_USER: matsak_dev
      ELASTICSEARCH_PASSWORD: Matsak@2025_Dev
      EXCHANGERATE_API_KEY: "${EXCHANGERATE_API_KEY}"
    depends_on:
      - mongodb
      - mailhog
      - redis
      - elasticsearch
    volumes:
      - .:/app
      - matsak_node_modules:/app/node_modules
      - ./uploads:/app/uploads
    networks:
      - matsak-dev-network

volumes:
  mongodb_dev_data:
    driver: local
  elasticsearch_dev_data:
    driver: local
  matsak_node_modules:
    driver: local

networks:
  matsak-dev-network:
    driver: bridge