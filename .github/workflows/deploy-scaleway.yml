name: Deploy to Scaleway

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write

env:
  REGISTRY: rg.fr-par.scw.cloud
  IMAGE_NAME: matsak-api
  CONTAINER_NAMESPACE: ${{ secrets.SCW_CONTAINER_NAMESPACE }}
  CONTAINER_NAME: matsak-api-prod
  SCW_SERVERLESS_NAMESPACE_NAME: prod-matsak

jobs:
  # NOTE: MongoDB, Redis, and Elasticsearch cannot be deployed as Scaleway Serverless Containers
  # because they require raw TCP connections, not HTTP/HTTPS.
  # 
  # RECOMMENDED SOLUTIONS:
  # 1. Use Scaleway Managed Databases (recommended for production):
  #    - https://www.scaleway.com/en/database/
  # 2. Use external managed services:
  #    - MongoDB Atlas (https://www.mongodb.com/cloud/atlas)
  #    - Redis Cloud (https://redis.com/cloud/)
  #    - Elastic Cloud (https://cloud.elastic.co/)
  # 3. Deploy on Scaleway Instances with Docker Compose
  #
  # For now, this workflow expects you to provide connection strings via GitHub Secrets:
  # - MONGO_URI (full connection string with credentials)
  # - REDIS_URL (hostname or full connection string)
  # - ELASTICSEARCH_NODE (full URL with protocol)
  
  validate-database-secrets:
    name: Validate Database Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.MONGO_URI }}" ]; then
            echo "❌ MONGO_URI secret is not set"
            echo "Please add your MongoDB connection string to GitHub secrets"
            exit 1
          fi
          if [ -z "${{ secrets.REDIS_URL }}" ]; then
            echo "❌ REDIS_URL secret is not set"
            echo "Please add your Redis connection string to GitHub secrets"
            exit 1
          fi
          if [ -z "${{ secrets.ELASTICSEARCH_NODE }}" ]; then
            echo "❌ ELASTICSEARCH_NODE secret is not set"
            echo "Please add your Elasticsearch node URL to GitHub secrets"
            exit 1
          fi
  
  build-and-deploy:
    name: Build and Deploy to Scaleway
    runs-on: ubuntu-latest
    needs: [validate-database-secrets]
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Scaleway CLI
        uses: ./.github/actions/setup-scaleway-cli
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          organization-id: ${{ secrets.SCW_ORGANIZATION_ID }}
          project-id: ${{ secrets.SCW_PROJECT_ID }}

      - name: Ensure Container Registry namespace exists
        id: registry_namespace
        run: |
          # Check if namespace exists by name
          NAMESPACE_ID=$(scw registry namespace list -o json | jq -r '.[] | select(.name=="'"${{ env.CONTAINER_NAMESPACE }}"'") | .id')
          
          if [ -z "$NAMESPACE_ID" ]; then
            echo "Container Registry namespace not found. Creating..."
            NAMESPACE_ID=$(scw registry namespace create \
              name="${{ env.CONTAINER_NAMESPACE }}" \
              region=fr-par \
              is-public=false \
              -o json | jq -r '.id')

            if [ -z "$NAMESPACE_ID" ]; then
              echo "Failed to create namespace"
              exit 1
            fi
            echo "Created namespace: $NAMESPACE_ID"
            echo "⚠️  Please add SCW_CONTAINER_NAMESPACE_ID=$NAMESPACE_ID to your GitHub secrets"
          else
            echo "Container Registry namespace exists: $NAMESPACE_ID"
          fi
          
          # Export namespace ID for later steps
          echo "namespace_id=$NAMESPACE_ID" >> $GITHUB_OUTPUT
          echo "SCW_CONTAINER_NAMESPACE_ID=$NAMESPACE_ID" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONTAINER_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CONTAINER_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CONTAINER_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NODE_ENV=production

      - name: Verify image tags
        run: |
          echo "Docker image tags that were built:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Setup Scaleway CLI
        uses: ./.github/actions/setup-scaleway-cli
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          organization-id: ${{ secrets.SCW_ORGANIZATION_ID }}
          project-id: ${{ secrets.SCW_PROJECT_ID }}

      - name: Ensure Serverless Container namespace exists
        id: serverless_namespace
        run: |
          # Check if serverless container namespace exists by name
          NAMESPACE_ID=$(scw container namespace list -o json | jq -r ".[] | select(.name==\"${{ env.SCW_SERVERLESS_NAMESPACE_NAME }}\") | .id")
          
          if [ -z "$NAMESPACE_ID" ]; then
            echo "Serverless Container namespace not found. Creating..."
            NAMESPACE_ID=$(scw container namespace create \
              name="${{ env.SCW_SERVERLESS_NAMESPACE_NAME }}" \
              region=fr-par \
              -o json | jq -r '.id')
            
            if [ -z "$NAMESPACE_ID" ]; then
              echo "Failed to create container namespace"
              exit 1
            fi
            echo "Created container namespace: $NAMESPACE_ID"
          else
            echo "Using existing container namespace: $NAMESPACE_ID"
          fi
          
          # Export namespace ID for container creation
          echo "namespace_id=$NAMESPACE_ID" >> $GITHUB_OUTPUT

      - name: Check if container exists
        id: check_container
        run: |
          if scw container container list region=fr-par | grep -q "${{ env.CONTAINER_NAME }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            CONTAINER_ID=$(scw container container list region=fr-par -o json | jq -r '.[] | select(.name=="${{ env.CONTAINER_NAME }}") | .id')
            echo "container_id=$CONTAINER_ID" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing container (force fresh deploy)
        if: steps.check_container.outputs.exists == 'true'
        run: |
          echo "Deleting existing container to force fresh deployment with new image..."
          scw container container delete ${{ steps.check_container.outputs.container_id }} region=fr-par
          echo "Waiting for container deletion..."
          sleep 10

      - name: Create container
        run: |
          # Get the branch name and sanitize it for use in image tag
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          IMAGE_TAG=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          
          echo "Using image: ${{ env.REGISTRY }}/${{ env.CONTAINER_NAMESPACE }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          
          scw container container create \
            name=${{ env.CONTAINER_NAME }} \
            namespace-id=${{ steps.serverless_namespace.outputs.namespace_id }} \
            registry-image=${{ env.REGISTRY }}/${{ env.CONTAINER_NAMESPACE }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            port=8080 \
            min-scale=1 \
            max-scale=5 \
            cpu-limit=1000 \
            memory-limit=2048 \
            timeout=300s \
            environment-variables.NODE_ENV=production \
            environment-variables.MONGO_URI=${{ secrets.MONGO_URI }} \
            environment-variables.DB_URI=${{ secrets.MONGO_URI }} \
            environment-variables.REDIS_URL=${{ secrets.REDIS_URL }} \
            environment-variables.ELASTICSEARCH_NODE=${{ secrets.ELASTICSEARCH_NODE }} \
            environment-variables.ELASTICSEARCH_USER=${{ secrets.ELASTICSEARCH_USER }} \
            environment-variables.ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }} \
            environment-variables.CORS_ORIGIN=${{ secrets.CORS_ORIGIN }} \
            environment-variables.MAIL_HOST=${{ secrets.MAIL_HOST }} \
            environment-variables.MAIL_PORT=${{ secrets.MAIL_PORT }} \
            environment-variables.MAIL_USER=${{ secrets.MAIL_USER }} \
            environment-variables.MAIL_FROM=${{ secrets.MAIL_FROM }} \
            environment-variables.JWT_SECRET=${{ secrets.JWT_SECRET }} \
            environment-variables.AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            environment-variables.AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            environment-variables.AWS_REGION=${{ secrets.AWS_REGION }} \
            environment-variables.AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}

      - name: Deploy container
        run: |
          CONTAINER_ID=$(scw container container list region=fr-par -o json | jq -r '.[] | select(.name=="'"${{ env.CONTAINER_NAME }}"'") | .id')
          if [ -z "$CONTAINER_ID" ]; then
            echo "Error: Container was not created"
            exit 1
          fi
          scw container container deploy $CONTAINER_ID region=fr-par
          echo "Container deployed: $CONTAINER_ID"

      - name: Wait for deployment
        run: |
          CONTAINER_ID=$(scw container container list region=fr-par -o json | jq -r '.[] | select(.name=="'"${{ env.CONTAINER_NAME }}"'") | .id')
          echo "Waiting for container to be ready..."
          for i in {1..30}; do
            STATUS=$(scw container container get $CONTAINER_ID region=fr-par -o json | jq -r '.status')
            if [ "$STATUS" = "ready" ]; then
              echo "Container is ready!"
              exit 0
            fi
            echo "Current status: $STATUS (attempt $i/30)"
            sleep 10
          done
          echo "Timeout waiting for container to be ready"
          exit 1

      - name: Get container URL
        run: |
          CONTAINER_ID=$(scw container container list -o json | jq -r '.[] | select(.name=="'"${{ env.CONTAINER_NAME }}"'") | .id')
          CONTAINER_URL=$(scw container container get $CONTAINER_ID -o json | jq -r '.domain_name')
          echo "🚀 Deployment successful!"
          echo "📍 Container URL: https://$CONTAINER_URL"
          echo "container_url=https://$CONTAINER_URL" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          CONTAINER_ID=$(scw container container list -o json | jq -r '.[] | select(.name=="'"${{ env.CONTAINER_NAME }}"'") | .id')
          CONTAINER_URL=$(scw container container get $CONTAINER_ID -o json | jq -r '.domain_name')
          
          echo "Performing health check..."
          for i in {1..10}; do
            if curl -f -s https://$CONTAINER_URL/api > /dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Health check attempt $i/10 failed, retrying..."
            sleep 5
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          CONTAINER_ID=$(scw container container list -o json | jq -r '.[] | select(.name=="'"${{ env.CONTAINER_NAME }}"'") | .id')
          CONTAINER_URL=$(scw container container get $CONTAINER_ID -o json | jq -r '.domain_name')
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment to Scaleway completed successfully"
            echo ""
            echo "📦 API Container:"
            echo "  - URL: https://$CONTAINER_URL"
            echo ""
            echo "⚠️  Database services should be configured externally:"
            echo "  - Use Scaleway Managed Databases or external services"
            echo "  - MongoDB: Set MONGO_URI secret with your connection string"
            echo "  - Redis: Set REDIS_URL secret with your Redis endpoint"
            echo "  - Elasticsearch: Set ELASTICSEARCH_NODE secret with your endpoint"
          else
            echo "❌ Deployment to Scaleway failed"
          fi

  cleanup:
    name: Cleanup old images
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    steps:
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Delete old images
        run: |
          echo "Cleaning up old container images..."
          # Keep last 5 images, delete older ones
          # This requires manual implementation based on Scaleway's registry API
          echo "Manual cleanup recommended via Scaleway console"
