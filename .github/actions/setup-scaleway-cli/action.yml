name: 'Setup Scaleway CLI'
description: 'Install and configure Scaleway CLI'
inputs:
  access-key:
    description: 'Scaleway access key'
    required: true
  secret-key:
    description: 'Scaleway secret key'
    required: true
  organization-id:
    description: 'Scaleway organization ID'
    required: true
  project-id:
    description: 'Scaleway project ID'
    required: true
  default-region:
    description: 'Default region'
    required: false
    default: 'fr-par'
  default-zone:
    description: 'Default zone'
    required: false
    default: 'fr-par-1'

runs:
  using: 'composite'
  steps:
    - name: Install Scaleway CLI
      shell: bash
      run: |
        curl -o /usr/local/bin/scw -L "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/')"
        chmod +x /usr/local/bin/scw
        scw version

    - name: Configure Scaleway CLI
      shell: bash
      run: |
        scw config set access-key=${{ inputs.access-key }}
        scw config set secret-key=${{ inputs.secret-key }}
        scw config set default-organization-id=${{ inputs.organization-id }}
        scw config set default-project-id=${{ inputs.project-id }}
        scw config set default-region=${{ inputs.default-region }}
        scw config set default-zone=${{ inputs.default-zone }}
