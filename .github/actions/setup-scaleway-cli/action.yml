name: 'Setup Scaleway CLI'
description: 'Install and configure Scaleway CLI'
inputs:
  access-key:
    description: 'Scaleway access key'
    required: true
  secret-key:
    description: 'Scaleway secret key'
    required: true
  organization-id:
    description: 'Scaleway organization ID'
    required: true
  project-id:
    description: 'Scaleway project ID'
    required: true
  default-region:
    description: 'Default region'
    required: false
    default: 'fr-par'
  default-zone:
    description: 'Default zone'
    required: false
    default: 'fr-par-1'

runs:
  using: 'composite'
  steps:
    - name: Install Scaleway CLI
      shell: bash
      run: |
        # Determine OS and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        
        # Map architecture to Scaleway's naming convention
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        
        # Download Scaleway CLI
        curl -fsSL -o /usr/local/bin/scw "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_${OS}_${ARCH}"
        chmod +x /usr/local/bin/scw
        scw version

    - name: Configure Scaleway CLI
      shell: bash
      run: |
        # Export environment variables for subsequent steps in the workflow
        echo "SCW_ACCESS_KEY=${{ inputs.access-key }}" >> $GITHUB_ENV
        echo "SCW_SECRET_KEY=${{ inputs.secret-key }}" >> $GITHUB_ENV
        echo "SCW_DEFAULT_ORGANIZATION_ID=${{ inputs.organization-id }}" >> $GITHUB_ENV
        echo "SCW_DEFAULT_PROJECT_ID=${{ inputs.project-id }}" >> $GITHUB_ENV
        echo "SCW_DEFAULT_REGION=${{ inputs.default-region }}" >> $GITHUB_ENV
        echo "SCW_DEFAULT_ZONE=${{ inputs.default-zone }}" >> $GITHUB_ENV
        echo "Scaleway CLI configured via environment variables"
