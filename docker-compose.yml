version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:7.0
    container_name: matsak-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: matsak
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - matsak-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # API service (includes migration execution on startup)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matsak-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/matsak
      - DB_URI=mongodb://mongodb:27017/matsak
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret-change-in-production}
      - CORS_ORIGIN=["http://localhost:3000", "http://localhost:8080"]
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - matsak-network

volumes:
  mongodb_data:
    driver: local

networks:
  matsak-network:
    driver: bridge